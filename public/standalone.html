<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产业带智能看板 - 深圳弘歌电子有限公司</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* ===== CSS Variables & Reset ===== */
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #1a2332;
  --bg-hover: #243044;
  --border-color: #1e3a5f;
  --accent: #00f2fe;
  --accent2: #4facfe;
  --accent3: #43e97b;
  --text-primary: #e0e6ed;
  --text-secondary: #8899aa;
  --text-muted: #556677;
  --glow-cyan: 0 0 20px rgba(0,242,254,0.3);
  --glow-blue: 0 0 20px rgba(79,172,254,0.3);
  --gradient-main: linear-gradient(135deg, #0a0e17 0%, #111827 50%, #0d1321 100%);
  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-main);
  background: var(--gradient-main);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ===== Login Page ===== */
.login-page {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: var(--gradient-main);
}

.login-container {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 48px 40px;
  width: 420px;
  box-shadow: var(--glow-cyan);
  position: relative;
  overflow: hidden;
}

.login-container::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.login-title {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 8px;
  letter-spacing: 2px;
}

.login-subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 32px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.form-group input {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 14px;
  transition: all 0.3s;
  outline: none;
}

.form-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,242,254,0.1);
}

.btn-login, .btn-register {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.btn-login {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: var(--bg-primary);
}

.btn-login:hover {
  box-shadow: var(--glow-cyan);
  transform: translateY(-1px);
}

.btn-register {
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
}

.btn-register:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.login-error {
  color: #ff6b6b;
  font-size: 12px;
  text-align: center;
  margin-top: 10px;
  min-height: 18px;
}

/* ===== Dashboard Layout ===== */
.dashboard {
  display: none;
  min-height: 100vh;
}

.dashboard.active { display: block; }

/* Header */
.header {
  padding: 20px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
  background: rgba(10,14,23,0.95);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.menu-toggle {
  width: 40px;
  height: 40px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.3s;
}

.menu-toggle:hover {
  border-color: var(--accent);
  box-shadow: var(--glow-cyan);
}

.header-title {
  font-size: 14px;
  color: var(--text-secondary);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--bg-primary);
  font-weight: 700;
  font-size: 13px;
}

.btn-logout {
  padding: 8px 16px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-logout:hover {
  border-color: #ff6b6b;
  color: #ff6b6b;
}

/* ===== Sidebar ===== */
.sidebar {
  position: fixed;
  left: -320px;
  top: 0;
  width: 320px;
  height: 100vh;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  z-index: 200;
  transition: left 0.3s ease;
  overflow-y: auto;
  padding-top: 20px;
}

.sidebar.open { left: 0; }

.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 199;
  display: none;
}

.sidebar-overlay.show { display: block; }

.sidebar-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 8px;
}

.sidebar-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--accent);
}

.sidebar-close {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 6px;
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-close:hover { color: var(--accent); }

.category-item {
  padding: 12px 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.2s;
  border-left: 3px solid transparent;
}

.category-item:hover {
  background: var(--bg-hover);
  border-left-color: var(--accent);
}

.category-item.active {
  background: var(--bg-hover);
  border-left-color: var(--accent);
}

.category-name {
  font-size: 13px;
  color: var(--text-primary);
}

.category-count {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-card);
  padding: 2px 8px;
  border-radius: 10px;
}

/* ===== Main Content ===== */
.main-content {
  padding: 0;
}

/* Company Title & Search */
.search-section {
  text-align: center;
  padding: 40px 20px 30px;
  position: relative;
}

.company-name {
  font-size: 28px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
  letter-spacing: 4px;
}

.company-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
  letter-spacing: 3px;
}

.search-box {
  max-width: 680px;
  margin: 0 auto;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 16px 56px 16px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  color: var(--text-primary);
  font-size: 15px;
  outline: none;
  transition: all 0.3s;
}

.search-input:focus {
  border-color: var(--accent);
  box-shadow: var(--glow-cyan);
}

.search-input::placeholder {
  color: var(--text-muted);
}

.search-btn {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: var(--bg-primary);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}

.search-btn:hover {
  box-shadow: var(--glow-cyan);
}

.search-tags {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.search-tag {
  padding: 6px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
}

.search-tag:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ===== Stats Bar ===== */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 40px;
  padding: 20px;
  margin: 0 30px;
  border-top: 1px solid var(--border-color);
  border-bottom: 1px solid var(--border-color);
}

.stat-item {
  text-align: center;
}

.stat-value {
  font-size: 28px;
  font-weight: 800;
  font-family: var(--font-mono);
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ===== Map Section ===== */
.map-section {
  padding: 30px;
  position: relative;
}

.map-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.map-title::before {
  content: '';
  width: 4px;
  height: 20px;
  background: var(--accent);
  border-radius: 2px;
}

#china-map {
  width: 100%;
  height: 620px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  overflow: hidden;
}

/* ===== Search Results ===== */
.search-results {
  padding: 0 30px 30px;
  display: none;
}

.search-results.active { display: block; }

.results-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.results-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
}

.results-count {
  font-size: 13px;
  color: var(--text-muted);
}

.results-close {
  padding: 6px 16px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
}

.results-close:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.result-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.result-card:hover {
  border-color: var(--accent);
  transform: translateX(4px);
}

.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.result-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--accent);
}

.result-badge {
  padding: 4px 10px;
  background: rgba(0,242,254,0.1);
  border: 1px solid rgba(0,242,254,0.2);
  border-radius: 6px;
  font-size: 11px;
  color: var(--accent);
}

.result-meta {
  display: flex;
  gap: 20px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.result-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.result-tag {
  padding: 3px 8px;
  background: var(--bg-secondary);
  border-radius: 4px;
  font-size: 11px;
  color: var(--text-muted);
}

/* ===== Detail Panel ===== */
.detail-panel {
  position: fixed;
  right: -600px;
  top: 0;
  width: 600px;
  height: 100vh;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border-color);
  z-index: 300;
  transition: right 0.3s ease;
  overflow-y: auto;
  box-shadow: -10px 0 40px rgba(0,0,0,0.5);
}

.detail-panel.open { right: 0; }

.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 299;
  display: none;
}

.detail-overlay.show { display: block; }

.detail-header {
  padding: 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--bg-secondary);
  z-index: 1;
}

.detail-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}

.detail-location {
  font-size: 13px;
  color: var(--text-secondary);
}

.detail-close {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.detail-close:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.detail-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 20px 24px;
}

.detail-stat {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 14px;
  text-align: center;
}

.detail-stat-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  font-family: var(--font-mono);
}

.detail-stat-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.detail-section {
  padding: 0 24px 24px;
}

.detail-section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.detail-section-title::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--accent);
  border-radius: 2px;
}

/* Supplier Card */
.supplier-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 12px;
  transition: all 0.2s;
}

.supplier-card:hover {
  border-color: var(--accent2);
}

.supplier-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--accent2);
  margin-bottom: 12px;
}

.supplier-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.supplier-field {
  font-size: 12px;
}

.supplier-field-label {
  color: var(--text-muted);
  margin-bottom: 2px;
}

.supplier-field-value {
  color: var(--text-primary);
  word-break: break-all;
}

.supplier-field-value a {
  color: var(--accent);
  text-decoration: none;
}

.supplier-field-value a:hover {
  text-decoration: underline;
}

.supplier-partners {
  grid-column: 1 / -1;
  margin-top: 4px;
}

.partner-tag {
  display: inline-block;
  padding: 2px 8px;
  background: rgba(67,233,123,0.1);
  border: 1px solid rgba(67,233,123,0.2);
  border-radius: 4px;
  font-size: 11px;
  color: var(--accent3);
  margin: 2px 4px 2px 0;
}

/* External link buttons */
.external-links {
  padding: 16px 24px;
  border-top: 1px solid var(--border-color);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.ext-link-btn {
  padding: 8px 16px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.ext-link-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ===== Category Results Page ===== */
.category-results {
  padding: 0 30px 30px;
  display: none;
}

.category-results.active { display: block; }

.category-belt-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.category-belt-card:hover {
  border-color: var(--accent);
  transform: translateX(4px);
}

/* ===== Loading animation ===== */
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 5px rgba(0,242,254,0.2); }
  50% { box-shadow: 0 0 20px rgba(0,242,254,0.4); }
}

.loading {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
}

/* ===== Grid Background Effect ===== */
.grid-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-image:
    linear-gradient(rgba(30,58,95,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(30,58,95,0.1) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none;
}

/* ===== Settings Toggle Button ===== */
.settings-toggle {
  width: 40px;
  height: 40px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--accent);
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}
.settings-toggle:hover {
  border-color: var(--accent);
  box-shadow: var(--glow-cyan);
}

/* ===== Settings Panel ===== */
.settings-panel { z-index: 300; }

.settings-tabs {
  display: flex;
  border-bottom: 1px solid var(--border-color);
  padding: 0 24px;
}
.settings-tab {
  padding: 12px 16px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.settings-tab:hover { color: var(--text-primary); }
.settings-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.settings-pane {
  display: none;
  padding: 20px 24px;
}
.settings-pane.active { display: block; }

.settings-form {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 20px;
}
.settings-form-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 16px;
}

.settings-msg {
  font-size: 12px;
  margin-top: 10px;
  min-height: 18px;
}
.settings-msg.success { color: var(--accent3); }
.settings-msg.error { color: #ff6b6b; }

/* User list */
.user-list { display: flex; flex-direction: column; gap: 8px; }
.user-row {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 12px 14px;
}
.user-row-info {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.user-row-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.user-row-role {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(0,242,254,0.1);
  color: var(--accent);
}
.user-row-date { font-size: 11px; color: var(--text-muted); margin-left: auto; }
.user-row-actions { display: flex; gap: 8px; align-items: center; }
.reset-pw-input {
  flex: 1;
  padding: 6px 10px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);

// ===== Search Frequency =====
function getSearchFreq() {
  try { return JSON.parse(localStorage.getItem('searchFreq') || '{}'); } catch(e) { return {}; }
}
function recordSearch(q) {
  if (!q || q.length < 1) return;
  const freq = getSearchFreq();
  freq[q] = (freq[q] || 0) + 1;
  localStorage.setItem('searchFreq', JSON.stringify(freq));
  renderSearchTags();
}
function renderSearchTags() {
  const container = document.getElementById('searchTagsContainer');
  if (!container) return;
  const freq = getSearchFreq();
  const defaults = ['电子电器','五金工具','纺织服装','家具家居','义乌','深圳','汽配','灯具照明'];
  // Merge: sort by frequency desc, fill with defaults
  const entries = Object.entries(freq).sort((a,b) => b[1] - a[1]);
  const topKeys = entries.map(e => e[0]);
  const merged = [];
  const seen = new Set();
  for (const k of topKeys) { if (merged.length >= 8) break; if (!seen.has(k)) { merged.push(k); seen.add(k); } }
  for (const k of defaults) { if (merged.length >= 8) break; if (!seen.has(k)) { merged.push(k); seen.add(k); } }

  container.innerHTML = merged.map(q => {
    const count = freq[q] || 0;
    const hot = count >= 3 ? ' hot' : '';
    return `<span class="search-tag${hot}" data-q="${q}">${q}${count > 0 ? '<sup>' + count + '</sup>' : ''}</span>`;
  }).join('');

  container.querySelectorAll('.search-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      document.getElementById('searchInput').value = tag.dataset.q;
      doSearch(tag.dataset.q);
    });
  });
}

function animateNumber(id, target) {
  const el = document.getElementById(id);
  const duration = 1200;
  const start = performance.now();
  const fmt = target > 9999
    ? (n) => (n / 10000).toFixed(1) + '万+'
    : (n) => n.toLocaleString();
  function tick(now) {
    const progress = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = fmt(Math.floor(target * eased));
    if (progress < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

async function doSearch(query) {
  if (!query) return;
  var keyword = query.toLowerCase();
  var results = [];
  beltData.provinces.forEach(function(p) {
    p.belts.forEach(function(b) {
      var match = b.name.toLowerCase().includes(keyword) ||
        b.category.toLowerCase().includes(keyword) ||
        b.location.toLowerCase().includes(keyword) ||
        (b.county && b.county.toLowerCase().includes(keyword)) ||
        (b.tags && b.tags.some(function(t) { return t.toLowerCase().includes(keyword); }));
      if (match) results.push(Object.assign({ province: p.name, provinceCode: p.code }, b));
    });
  });
  renderSearchResults(results, query);
}

    '上海市': [121.47, 31.23], '北京市': [116.41, 39.9],
    '太原市': [112.55, 37.87], '鄂尔多斯市': [109.99, 39.82],
    '银川市': [106.28, 38.47], '海西州': [97.37, 37.38],
    '阿克苏地区': [80.26, 41.17], '拉萨市': [91.11, 29.65], '海口市': [110.35, 20.02]
  };

  beltData.provinces.forEach(p => {
    const mapName = nameMap[p.name] || p.name;
    let totalSuppliers = 0;
    let beltCount = p.belts.length;
    let categories = new Set();
    p.belts.forEach(b => {
      totalSuppliers += b.supplierCount;
      categories.add(b.category);
      const coords = cityCoords[b.location];
      if (coords) {
        scatterData.push({ name: b.name, value: [...coords, b.supplierCount], belt: b, province: p.name });
      }
    });
    provinceNameMap[mapName] = p;
    provinceData.push({
      name: mapName, value: totalSuppliers, beltCount, categories: [...categories],
      belts: p.belts, provinceName: p.name,
      itemStyle: { areaColor: p.color + '30', borderColor: p.color }
    });
  });

  const option = {
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(17,24,39,0.95)',
      borderColor: '#1e3a5f',
      borderWidth: 1,
      textStyle: { color: '#e0e6ed', fontSize: 13 },
      formatter: function(params) {
        if (params.seriesType === 'scatter') {
          const b = params.data.belt;
          return `<div style="min-width:200px">
            <div style="font-size:15px;font-weight:700;color:#00f2fe;margin-bottom:6px">${b.name}</div>
            <div style="color:#8899aa;margin-bottom:4px">📍 ${b.location} · ${b.county || ''}</div>
            <div style="color:#8899aa;margin-bottom:4px">📦 ${b.category}</div>
            <div style="color:#4facfe;font-weight:600">🏭 ${b.supplierCount.toLocaleString()} 家供应商</div>
            <div style="color:#556677;margin-top:6px;font-size:11px">点击查看详情 →</div>
          </div>`;
        }
        if (params.data && params.data.beltCount) {
          const d = params.data;
          return `<div style="min-width:200px">
            <div style="font-size:15px;font-weight:700;color:#00f2fe;margin-bottom:6px">${d.provinceName}</div>
            <div style="color:#8899aa;margin-bottom:4px">产业带: ${d.beltCount} 个</div>
            <div style="color:#4facfe;font-weight:600;margin-bottom:4px">供应商: ${d.value.toLocaleString()} 家</div>
            <div style="color:#8899aa;font-size:12px">品类: ${d.categories.join('、')}</div>
            <div style="color:#556677;margin-top:6px;font-size:11px">点击查看所有产业带 →</div>
          </div>`;
        }
        return params.name;
      }
    },
    geo: {
      map: 'china', roam: true, zoom: 1.2, center: [104, 36],
      scaleLimit: { min: 0.8, max: 6 },
      label: { show: true, color: '#556677', fontSize: 10 },
      emphasis: {
        label: { color: '#00f2fe', fontSize: 12 },
        itemStyle: { areaColor: 'rgba(0,242,254,0.15)', borderColor: '#00f2fe', borderWidth: 2 }
      },
      itemStyle: { areaColor: '#1a2332', borderColor: '#1e3a5f', borderWidth: 1 },
      regions: provinceData.map(p => ({ name: p.name, itemStyle: p.itemStyle }))
    },
    series: [
      { name: '产业带', type: 'map', map: 'china', geoIndex: 0, data: provinceData },
      {
        name: '产业带热点', type: 'scatter', coordinateSystem: 'geo', data: scatterData,
        symbolSize: function(val) { return Math.max(8, Math.min(30, Math.sqrt(val[2]) / 8)); },
        itemStyle: { color: '#00f2fe', shadowBlur: 10, shadowColor: 'rgba(0,242,254,0.5)' },
        emphasis: { itemStyle: { color: '#4facfe', shadowBlur: 20, borderColor: '#fff', borderWidth: 1 } }
      },
      {
        name: '涟漪效果', type: 'effectScatter', coordinateSystem: 'geo',
        data: scatterData.filter(d => d.value[2] > 10000),
        symbolSize: function(val) { return Math.max(6, Math.min(20, Math.sqrt(val[2]) / 12)); },
        showEffectOn: 'render',
        rippleEffect: { brushType: 'stroke', scale: 3, period: 4 },
        itemStyle: { color: '#00f2fe', shadowBlur: 10, shadowColor: 'rgba(0,242,254,0.5)' }
      }
    ]
  };

  mapChart.setOption(option);
  mapChart.on('click', function(params) {
    if (params.seriesType === 'scatter' || params.seriesType === 'effectScatter') {
      openBeltDetail({ ...params.data.belt, province: params.data.province });
    } else if (params.data && params.data.belts) {
      showProvinceBelts(params.data);
    }
  });
  window.addEventListener('resize', () => mapChart && mapChart.resize());
}

function showProvinceBelts(provinceData) {
  const belts = provinceData.belts.map(b => ({ ...b, province: provinceData.provinceName }));
  belts.sort((a, b) => b.supplierCount - a.supplierCount);

  categoryPageState = { belts, page: 1, category: provinceData.provinceName };
  renderCategoryPage();

  document.getElementById('categoryResults').classList.add('active');
  document.getElementById('searchResults').classList.remove('active');
  hideMapSection();
  document.getElementById('categoryResults').scrollIntoView({ behavior: 'smooth' });
}

// ===== Event Listeners =====
document.addEventListener('DOMContentLoaded', () => {
  checkAuth();

  // Login
  document.getElementById('btnLogin').addEventListener('click', login);
  document.getElementById('btnRegister').addEventListener('click', register);
  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  // Logout
  document.getElementById('btnLogout').addEventListener('click', logout);

  // Sidebar
  document.getElementById('menuToggle').addEventListener('click', openSidebar);
  document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
  document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

  // Search
  document.getElementById('searchBtn').addEventListener('click', () => {
    doSearch(document.getElementById('searchInput').value.trim());
  });
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch(e.target.value.trim());
  });

  // Search tags - render dynamically based on frequency
  renderSearchTags();

  // Close results - FIX #2: show map again when closing
  document.getElementById('resultsClose').addEventListener('click', () => {
    document.getElementById('searchResults').classList.remove('active');
    showMapSection();
  });
  document.getElementById('categoryClose').addEventListener('click', () => {
    document.getElementById('categoryResults').classList.remove('active');
    showMapSection();
  });

  // Detail panel
  document.getElementById('detailClose').addEventListener('click', closeDetail);
  document.getElementById('detailOverlay').addEventListener('click', closeDetail);

  // Settings panel
  document.getElementById('settingsToggle').addEventListener('click', toggleSettingsPanel);
  document.getElementById('settingsClose').addEventListener('click', closeSettings);
  document.getElementById('settingsOverlay').addEventListener('click', closeSettings);

  // Settings tabs
  document.querySelectorAll('.settings-tab').forEach(tab => {
    tab.addEventListener('click', () => switchSettingsTab(tab.dataset.tab));
  });

  // Create account
  document.getElementById('btnCreateAccount').addEventListener('click', createSubAccount);

  // Change password
  document.getElementById('btnChangePassword').addEventListener('click', changeMyPassword);

  // File upload
  document.getElementById('btnUpload').addEventListener('click', uploadFiles);

  // ESC key
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeDetail();
      closeSidebar();
      closeSettings();
    }
  });
});

  </script>
</body>
